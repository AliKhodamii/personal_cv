  <circle cx="450" cy="191" r="45" fill="#e0e3dc"/>
  <rect x="428" y="159" width="44" height="48" rx="4" fill="none" stroke="#718071" stroke-width="3"/>
  <path d="M420 168h8m44 0h8M420 181h8m44 0h8M420 194h8m44 0h8M420 207h8m44 0h8" stroke="#718071" stroke-width="3" stroke-linecap="round"/>
