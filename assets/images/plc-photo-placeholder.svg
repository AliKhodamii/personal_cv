  <text x="450" y="348" text-anchor="middle" fill="#92968d" font-family="Vazirmatn,Arial,sans-serif" font-size="13">لطفاً عکس خودتان یا تصویر دارای مجوز استفادهٔ تجاری را بفرستید.</text>
